name: fxtube
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: video
priority: optional
maintainer: "Risqi Nur Fadilah <risqinf@users.noreply.github.com>"
description: "Ultra-lightweight YouTube client for low-spec hardware"
vendor: "Risqi Nur Fadilah"
homepage: "https://github.com/risqinf/fxtube"
license: "MIT"

contents:
  - src: dist/fxtube
    dst: /usr/bin/fxtube
    file_info:
      mode: 0755
  - src: packaging/fxtube.desktop
    dst: /usr/share/applications/fxtube.desktop
    file_info:
      mode: 0644
  - src: packaging/fxtube.svg
    dst: /usr/share/icons/hicolor/scalable/apps/fxtube.svg
    file_info:
      mode: 0644

depends:
  - yt-dlp
  - ffmpeg

recommends:
  - mpv
