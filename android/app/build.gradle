plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.risqinf.fxtube'
    compileSdk 34

    defaultConfig {
        applicationId "dev.risqinf.fxtube"
        minSdk 14
        targetSdk 34
        versionCode 4
        versionName "1.4.2"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero heavy dependencies to maintain sub-30MB RAM usage on Android 4.0+
}
